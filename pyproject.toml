[build-system]
requires = ["maturin>=1.15.0,<2"]
build-backend = "maturin"

[project]
name = "ksim"
description = "Trace-driven Kubernetes simulator for training and benchmarking autoscalers"
requires-python = ">=3.12"
license = { file = "LICENCE" }
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
gym = ["gymnasium>=1.4.0", "numpy>=2.5.4"]
datasets = ["polars>=2.0.0", "pyarrow>=26.0.0"]
analysis = ["numpy>=2.5.4", "scipy>=1.18.1", "matplotlib>=3.11.2"]
borg = ["google-cloud-bigquery>=3.45.2"]
train = ["stable-baselines3>=2.9.0", "sb3-contrib>=2.9.0", "torch>=2.14.0"]

[dependency-groups]
dev = [
    "maturin>=1.15.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.168.3",
    "ruff>=0.16.9",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "scipy-stubs>=1.18.1.1",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "gymnasium>=1.4.0",
]

[tool.maturin]
manifest-path = "crates/ksim-py/Cargo.toml"
python-source = "python"
module-name = "ksim._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["python/tests", "tools/ci/tests"]
pythonpath = ["tools/ci"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.mypy]
strict = true
files = ["python/ksim", "tools/ci/ksim_ci"]
