[workspace]
resolver = "3"
members = [
    "crates/ksim-core",
    "crates/ksim-workload",
    "crates/ksim-perf",
    "crates/ksim-autoscalers",
    "crates/ksim-metrics",
    "crates/ksim-bench",
    "crates/ksim-env",
    "crates/ksim-py",
    "crates/ksim-capi",
]

[workspace.package]
version = "0.1.0-beta"
edition = "2024"
rust-version = "1.98.1"
license-file = "LICENCE"
publish = false
repository = "https://github.com/SecCodeSmith/ksim"

[workspace.dependencies]
ksim-core = { path = "crates/ksim-core" }
ksim-workload = { path = "crates/ksim-workload" }
ksim-perf = { path = "crates/ksim-perf" }
ksim-autoscalers = { path = "crates/ksim-autoscalers" }
ksim-metrics = { path = "crates/ksim-metrics" }
ksim-bench = { path = "crates/ksim-bench" }
ksim-env = { path = "crates/ksim-env" }
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
approx = "0.5.1"
proptest = "1.11.0"
criterion = "0.8.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
toml = "1.1.6"
csv = "1.4.0"
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }
numpy = "0.29.0"
rayon = "1.12.0"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
