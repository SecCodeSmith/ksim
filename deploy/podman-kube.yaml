apiVersion: v1
kind: Pod
metadata:
  name: ksim
  labels:
    app: ksim
spec:
  restartPolicy: Never
  containers:
    - name: bench
      image: ghcr.io/seccodesmith/ksim:nightly
      args: ["ksim-bench", "--help"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
    - name: train
      image: ghcr.io/seccodesmith/ksim-train:nightly
      args: ["python", "-c", "import ksim"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
