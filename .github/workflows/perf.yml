name: perf
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  throughput-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-rust-python
      - run: cargo test --release -p ksim-core --test perf -- --ignored --nocapture --test-threads=1
      - run: cargo test --release -p ksim-env --test perf -- --ignored --nocapture --test-threads=1
