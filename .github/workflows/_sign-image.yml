name: _sign-image
on:
  workflow_call:
    inputs:
      ref:
        description: Image reference including a tag, resolved to its digest
        type: string
        required: true
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  sign:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: digest
        env:
          REF: ${{ inputs.ref }}
        run: |
          digest="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')"
          echo "ref=${REF%:*}@$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ steps.digest.outputs.ref }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - env:
          REF: ${{ steps.digest.outputs.ref }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
