name: _rust-test
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  rust-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-rust-python
      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace
      - run: cargo test --doc --workspace
