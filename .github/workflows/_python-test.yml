name: _python-test
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  python-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-rust-python
      - run: uv run --no-sync maturin develop
      - run: uv run --no-sync pytest
