name: dependency-review
on:
  pull_request:
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/dependency-review-action@v5.0.0
