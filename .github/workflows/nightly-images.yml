name: nightly-images
on:
  workflow_call:
    inputs:
      branch:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      branch:
        type: string
        required: true
        default: main
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  prep:
    uses: ./.github/workflows/_image-tags.yml
    with:
      branch: ${{ inputs.branch }}
  build:
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: runtime, name: ksim}
          - {target: train, name: ksim-train}
    uses: ./.github/workflows/_build-image-docker.yml
    with:
      ref: ${{ inputs.branch }}
      image: ${{ needs.prep.outputs.namespace }}/${{ matrix.name }}
      target: ${{ matrix.target }}
      push: true
      tags: ${{ needs.prep.outputs.tags }}
      platforms: linux/amd64,linux/arm64
  scan:
    needs: [prep, build]
    strategy: {fail-fast: false, matrix: {name: [ksim, ksim-train]}}
    uses: ./.github/workflows/_scan-image.yml
    with:
      image: ${{ needs.prep.outputs.namespace }}/${{ matrix.name }}:${{ needs.prep.outputs.version }}
      report: trivy-${{ matrix.name }}-${{ needs.prep.outputs.version }}
  sign:
    needs: [prep, scan]
    strategy: {fail-fast: false, matrix: {name: [ksim, ksim-train]}}
    uses: ./.github/workflows/_sign-image.yml
    with:
      ref: ${{ needs.prep.outputs.namespace }}/${{ matrix.name }}:${{ needs.prep.outputs.version }}
  verify:
    needs: [prep, sign]
    strategy: {matrix: {name: [ksim, ksim-train]}}
    uses: ./.github/workflows/_verify-image.yml
    with:
      image: ${{ needs.prep.outputs.namespace }}/${{ matrix.name }}:${{ needs.prep.outputs.version }}
