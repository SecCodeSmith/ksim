name: _scan-image
on:
  workflow_call:
    inputs:
      image:
        description: Registry image reference to scan
        type: string
        default: ''
      input:
        description: Artifact name holding image.tar to scan
        type: string
        default: ''
      report:
        description: Artifact name for the SARIF report
        type: string
        required: true
permissions:
  contents: read
  packages: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    env:
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ github.token }}
    steps:
      - if: inputs.input != ''
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.input }}
          path: scan
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image }}
          input: ${{ inputs.input != '' && 'scan/image.tar' || '' }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy.sarif
      - if: always() && hashFiles('trivy.sarif') != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.report }}
          path: trivy.sarif
