name: release-artifacts
on:
  push:
    tags: ['v*', '!v*-dev.*']
permissions:
  contents: read
jobs:
  binaries:
    uses: ./.github/workflows/_build-binaries.yml
  wheels:
    uses: ./.github/workflows/_build-wheels.yml
  release:
    needs: [binaries, wheels]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
