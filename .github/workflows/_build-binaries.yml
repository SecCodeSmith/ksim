name: _build-binaries
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - run: rustup show
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2.87.27
        with:
          tool: cbindgen
      - run: cargo build --release -p ksim-bench -p ksim-capi
      - name: Package
        run: |
          out="ksim-${{ matrix.arch }}-linux"
          mkdir "$out"
          cp target/release/ksim-bench target/release/libksim.so target/release/libksim.a "$out/"
          cbindgen --config crates/ksim-capi/cbindgen.toml --crate ksim-capi \
            --output "$out/ksim.h"
          tar -czf "$out.tar.gz" "$out"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: binaries-${{ matrix.arch }}
          path: ksim-${{ matrix.arch }}-linux.tar.gz
